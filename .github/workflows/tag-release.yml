name: Tag Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Extract ORT version
      id: version
      run: |
        version="$(sed -nE 's/.*version-catalog:([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' settings.gradle.kts | head -n1)"
        if [ -z "$version" ]; then
          echo "::error::Could not extract version-catalog version from settings.gradle.kts"
          exit 1
        fi
        echo "Extracted version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Create or replace tag
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f "$VERSION"
        git push origin "refs/tags/$VERSION" --force
